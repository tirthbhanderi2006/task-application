#
# nginx configuration for the containerised frontend.
# Serves the Vite SPA and reverse-proxies the API to the backend container.
#
upstream backend_upstream {
    server backend:5000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's default hostname arrives as the Host header — keep it usable
    server_name_in_redirect off;

    # --- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- API reverse proxy -------------------------------------------------
    # "proxy_pass" without a trailing URI keeps the original /api/... path.
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Server-Sent Events support (/api/eda/stream) — no buffering,
        # long-lived upstream connection.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # --- Static assets -----------------------------------------------------
    # Vite emits content-hashed files into /assets -> safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA history fallback ---------------------------------------------
    # React Router uses the History API, so unknown paths must return index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
